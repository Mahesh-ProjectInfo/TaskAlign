spring.application.name=Taskalign
 
# ===============================
# DATABASE CONFIGURATION
# ===============================
#spring.datasource.url=jdbc:mysql://localhost:3306/task_align_db
#spring.datasource.username=root
#spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
 
# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
# ===============================
# SERVER
# ===============================
#server.port=8080
server.port=${PORT}
 
 
 

 
#msg91.auth.key=557918AGcJU2q2g6a7464efP1
#msg91.sender.id=TSKOTP
 
msg91.auth.key=${Auth_Key}
msg91.sender.id=${Sender_Id}
 
 
 
 
# JWT Configuration
#jwt.secret=taskAlignJwtSecretKeyWithAtLeast32BytesLengthForSecurity
#jwt.expiration=86400000
 
jwt.secret=${SECRET}
jwt.expiration=${EXPIRATION}
 
# Mail Configuration
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
 
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_ENABLE}



